name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          stats_file: profile/stats.svg
          top_languages_file: profile/top-langs.svg
          options: >
            username=arthurhenriquesilva
            &show_icons=true
            &theme=github_dark
            &hide_border=true
          top_languages_options: >
            username=arthurhenriquesilva
            &layout=compact
            &theme=github_dark
            &hide_border=true

      - name: Commit generated cards
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: update GitHub stats"
